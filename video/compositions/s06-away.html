  <div id="root" data-composition-id="s06-away" data-width="1920" data-height="1080">

  <script>
    // Text layer over the 3D world. Times are film seconds; this host starts at 61.5 s.
    const T = (s) => Math.max(0, s - 61.5);
    const tl = gsap.timeline({ paused: true });
    const SETTLE = "power3.out", EXIT = "power2.in", SNAP = "back.out(1.4)";
    // a key-word callout: accent bar grows, words rise out of a mask, then the card leaves
    function callout(id, at, hold, scrim) {
      const el = "#" + id;
      tl.fromTo(el, { opacity: 0, y: 0 }, { opacity: 1, duration: 0.12 }, T(at) - 0.12);
      tl.fromTo(el + " .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: SETTLE }, T(at) - 0.12);
      tl.fromTo(el + " .w b", { yPercent: 115 }, { yPercent: 0, duration: 0.45, ease: SETTLE, stagger: 0.06 }, T(at) - 0.1);
      tl.to(el, { opacity: 0, y: -14, duration: 0.3, ease: EXIT }, T(at) + hold);
      if (scrim) {
        tl.fromTo("#" + scrim, { opacity: 0 }, { opacity: 1, duration: 0.3 }, T(at) - 0.2);
        tl.to("#" + scrim, { opacity: 0, duration: 0.4 }, T(at) + hold + 0.05);
      }
    }
    // word-by-word reveal; each word lands at its time
    function words(sel, times, d = 0.2) {
      times.forEach((at, i) => tl.fromTo(sel[i], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: d, ease: SETTLE }, T(at) - 0.1));
    }
    function fadeIn(sel, at, d = 0.4) { tl.fromTo(sel, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: d, ease: SETTLE }, T(at) - 0.1); }
    function fadeOut(sel, at, d = 0.3) { tl.to(sel, { opacity: 0, duration: d, ease: EXIT }, T(at)); }
    function chip(id, at, out) {
      tl.fromTo("#" + id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: SETTLE }, T(at));
      if (out) fadeOut("#" + id, out);
    }

    chip("s06-chip", 61.95);
    tl.fromTo("#s06-st", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T(62.9));
    tl.fromTo("#s06-hayya", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: SETTLE }, T(63.0));
    fadeIn("#s06-tr", 63.6);
    fadeOut(["#s06-hayya", "#s06-tr", "#s06-st"], 66.0, 0.4);
    callout("s06-c1", 67.31, 2.2, "s06-sc");
    tl.set({}, {}, 9.0667);
    window.__timelines["s06-away"] = tl;
