  <script>
    // Local clock: host starts at frame 0. T(frame) -> seconds, F(frames) -> seconds.
    const O = 0, T = (f) => (f - O) / 30, F = (n) => n / 30;
    const tl = gsap.timeline({ paused: true });
    const SETTLE = "power3.out", EXIT = "power2.in", GLIDE = "power2.inOut", BREATH = "sine.inOut", SNAP = "back.out(1.4)";

    // Initial states
    gsap.set("#s01-phone", { scale: 0.45 });
    gsap.set("#s01-hand", { scaleX: -1, x: 700 });
    gsap.set("#s01-matwrap", { scaleX: 0, rotation: -6 });
    gsap.set("#s01-c1", { y: 24 });

    // Dim hallway fades up, ambient lamp breath, slow push
    tl.to("#s01-veil", { opacity: 0, duration: F(24), ease: "power2.out" }, 0);
    tl.to("#s01-lampglow", { opacity: 0.85, duration: F(45), ease: BREATH, repeat: 6, yoyo: true }, 0);
    tl.fromTo("#s01-world", { scale: 1 }, { scale: 1.02, duration: T(326), ease: "none" }, 0);

    // f4 "Adhan": phone lights up
    tl.fromTo("#s01-pglow", { opacity: 0 }, { opacity: 0.85, duration: F(10), ease: SETTLE }, T(4));
    tl.fromTo("#s01-pdot", { opacity: 0, scale: 0.2, transformOrigin: "196px 62px" }, { opacity: 1, scale: 1, duration: F(10), ease: SNAP }, T(4));
    tl.fromTo("#s01-wallglow", { opacity: 0 }, { opacity: 0.35, duration: F(14), ease: SETTLE }, T(4));

    // f40 "one minute": hand enters from the right edge and reaches
    tl.to("#s01-hand", { x: 0, duration: F(15), ease: SETTLE }, T(40));

    // f100 "pick up your phone": phone lifts with the hand, screen glow grows on the wall
    tl.to("#s01-phone", { scale: 1, y: 50, duration: F(24), ease: GLIDE }, T(100));
    tl.to("#s01-hand", { y: 50, duration: F(24), ease: GLIDE }, T(100));
    tl.to("#s01-wallglow", { opacity: 0.95, duration: F(30), ease: SETTLE }, T(100));
    tl.to("#s01-pglow", { opacity: 1, duration: F(20), ease: SETTLE }, T(100));

    // f170 HERO "Twenty minutes later": clock hands spin +20 min (linear, the one allowed use)
    tl.fromTo("#s01-minute", { rotation: 0, svgOrigin: "150 150" }, { rotation: 840, svgOrigin: "150 150", duration: F(40), ease: "none" }, T(170));
    tl.fromTo("#s01-hour", { rotation: 0, svgOrigin: "150 150" }, { rotation: 70, svgOrigin: "150 150", duration: F(40), ease: "none" }, T(170));
    tl.to("#s01-c1", { opacity: 1, y: 0, duration: F(12), ease: SETTLE }, T(170));
    tl.to("#s01-c1", { opacity: 0, duration: F(10), ease: EXIT }, T(170 + 12 + 60));

    // f213 "rush": mat unrolls crooked, corner folded
    tl.to("#s01-matwrap", { scaleX: 1, duration: F(18), ease: SETTLE }, T(213));

    // f262 hand lets go, glow dims to a single window light (the hand-off)
    tl.to("#s01-hand", { x: 700, duration: F(18), ease: EXIT }, T(262));
    tl.to("#s01-wallglow", { opacity: 0, duration: F(30), ease: "power2.inOut" }, T(262));
    tl.to("#s01-pglow", { opacity: 0.35, duration: F(30), ease: "power2.inOut" }, T(262));
    tl.to("#s01-winlight", { opacity: 0.9, duration: F(30), ease: "power2.inOut" }, T(268));

    window.__timelines["s01-hook"] = tl;
  </script>
